name: ClipDeck

# ── Версия: X.Y.N ─────────────────────────────────────────────────────────
# X — глобальные изменения. Поднимается ВРУЧНУЮ и только по явной команде
#     («выложи релизную версию»).
# Y — крупные изменения: поднимается на каждом СТАБИЛЬНОМ релизе, тоже
#     вручную, по явной команде.
# N — номер сборки CI. КАЖДАЯ сборка в превью публикует текущий N и САМА
#     поднимает его здесь до N+1 для следующего пуша. Число монотонное, не
#     сбрасывается при смене X/Y (CFBundleVersion обязан расти). Здесь лежит
#     номер СЛЕДУЮЩЕЙ сборки.
#
# CD_VERSION = "X.Y" (строка), CD_BUILD = N (число).
# Итог "<CD_VERSION>.<CD_BUILD>" идёт в CFBundleShortVersionString, в
# манифест GBox и в названия превью/релизов. CFBundleVersion = CD_BUILD.
#
# Превью: пуш в main → build.yml бампит N, собирает и ОБНОВЛЯЕТ один и тот же
#         prerelease «preview» + gh-pages. Теги v* НЕ создаются.
# Релиз:  только по явной команде — вручную поднять X/Y (и, если надо, N)
#         здесь, запушить тег vX.Y.N → сработает release.yml.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 9U945T6L7A
    CD_VERSION: "1.0"
    CD_BUILD: "9"

options:
  # Пока самый свежий SDK на раннерах — iOS 26.x (Xcode 26.6): при target 27.0
  # xcodebuild отбрасывает все simulator-destinations (их OS < target).
  # Вернуть "27.0" после появления iOS 27 SDK.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  ClipDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ClipDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.ClipDeck
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClipDeck.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Юнит-тесты (Swift Testing). Это НЕ appex и в .ipa не попадает:
  # бандл существует только для локальной проверки и CI-теста.
  ClipDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ClipDeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.l1ratch.ClipDeck.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipDeck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClipDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ClipDeck:
    build:
      targets:
        ClipDeck: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - ClipDeckTests
